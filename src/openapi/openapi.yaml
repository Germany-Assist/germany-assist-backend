openapi: 3.0.0
info:
  title: Germany-Assist APIs Documentation
  version: 0.1.9

servers:
  - url: http://localhost:3000/api
    description: Local server
  - url: http://localhost:3001/api
    description: Staging server
  - url: http://api.example.com/v1
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

