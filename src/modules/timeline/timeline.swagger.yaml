# Timeline Module Routes
/timeline/client/readTimeline/{id}:
  get:
    tags: [Timeline]
    summary: Read Timeline (Client)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: The hashed ID of the timeline
        schema:
          type: string
    responses:
      200:
        description: Timeline data retrieved
      401:
        description: Unauthorized

/timeline/provider/archiveTimeline/{id}:
  put:
    tags: [Timeline]
    summary: Archive Timeline (Provider)
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: The hashed ID of the timeline to archive
        schema:
          type: string
    responses:
      200:
        description: Timeline archived successfully

/timeline/provider/createNewTimeline:
  post:
    tags: [Timeline]
    summary: Create New Timeline (Provider)
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: { type: string }
              description: { type: string }
    responses:
      201:
        description: Timeline created
